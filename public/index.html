<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#111827">
    <title>Agent Outpost</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" type="module"></script>
  </head>
  <body>
    <main class="shell">
      <section id="chat-list" class="chat-list">
        <header class="topbar">
          <div>
            <p class="eyebrow">Agent Outpost</p>
            <h1>Chats</h1>
          </div>
          <span class="state">Server</span>
        </header>
        <section class="resources">
          <button id="diagnostics-toggle" class="resources-toggle" type="button" aria-expanded="false" aria-controls="diagnostics-panel">
            Server diagnostics
          </button>
        <div id="diagnostics-panel" class="resource-grid" aria-live="polite" hidden>
          <div><span>CPU</span><strong id="cpu">--</strong></div>
          <div><span>Memory</span><strong id="memory">--</strong></div>
          <div><span>Disk</span><strong id="disk">--</strong></div>
          <div><span>Load</span><strong id="load">--</strong></div>
          <div><span>Last deployment</span><strong id="last-deployment">--</strong></div>
        </div>
        </section>
        <form id="new-chat-form" class="new-chat-form">
          <label for="project-select">Create a new chat</label>
          <div class="new-chat-row">
            <select id="project-select" name="project" required>
              <option value="">Loading projects…</option>
            </select>
            <button type="submit">New chat</button>
          </div>
        </form>
        <section id="chat-entries" class="chat-entries" aria-label="Chats"></section>
      </section>

      <section id="chat-view" class="chat-view" hidden>
        <header class="topbar">
          <button id="back-to-chats" class="back-button" type="button">← Chats</button>
          <div class="chat-heading">
            <p class="eyebrow">Active chat</p>
            <h1 id="chat-title">Mobile agent</h1>
          </div>
          <span id="state" class="state" data-state="starting">Starting</span>
        </header>

        <section id="timeline" class="timeline" aria-label="Conversation" aria-live="polite"></section>
        <button id="scroll-to-bottom" class="scroll-to-bottom" type="button" aria-label="Scroll to latest message" title="Scroll to latest message" hidden>↓</button>

      <form id="composer" class="composer">
        <p id="error" class="error" role="alert" aria-live="polite"></p>
        <div class="input-row">
          <textarea id="message" name="message" rows="2" maxlength="20000" aria-label="Message the agent" required></textarea>
          <div class="actions">
            <button id="cancel" class="secondary" type="button" hidden>Stop</button>
            <button id="send" type="submit" aria-label="Send message" title="Send message">
              <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false">
                <path d="m3 3 18 9-18 9 3.5-9L3 3Zm3.5 9h9" />
              </svg>
            </button>
          </div>
        </div>
        <button id="model-button" class="model-button" type="button" aria-haspopup="dialog">auto</button>
      </form>
      <dialog id="model-dialog" class="model-dialog">
        <form method="dialog">
          <h2>Model</h2>
          <label for="model-select">Model ID</label>
          <select id="model-select"></select>
          <p>Thinking level: <strong>medium</strong></p>
          <button value="cancel" class="secondary">Close</button>
          <button id="save-model" value="default" type="submit">Use model</button>
        </form>
      </dialog>
      </section>
    </main>
  </body>
</html>
