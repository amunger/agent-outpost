<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#111827">
    <title>Agent Outpost</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" type="module"></script>
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Agent Outpost</p>
          <h1>Mobile agent</h1>
        </div>
        <span id="state" class="state" data-state="starting">Starting</span>
      </header>

      <details class="resources">
        <summary>Dev box status</summary>
        <div class="resource-grid" aria-live="polite">
          <div><span>CPU</span><strong id="cpu">--</strong></div>
          <div><span>Memory</span><strong id="memory">--</strong></div>
          <div><span>Disk</span><strong id="disk">--</strong></div>
          <div><span>Load</span><strong id="load">--</strong></div>
        </div>
      </details>

      <section id="timeline" class="timeline" aria-label="Conversation" aria-live="polite"></section>

      <form id="composer" class="composer">
        <div class="input-row">
          <textarea id="message" name="message" rows="2" maxlength="20000" aria-label="Message the agent" required></textarea>
          <div class="actions">
            <button id="cancel" class="secondary" type="button" hidden>Stop</button>
            <button id="send" type="submit" aria-label="Send message" title="Send message">
              <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false">
                <path d="m3 3 18 9-18 9 3.5-9L3 3Zm3.5 9h9" />
              </svg>
            </button>
          </div>
        </div>
        <p id="error" class="error" role="alert"></p>
      </form>
    </main>
  </body>
</html>
